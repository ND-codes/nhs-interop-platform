global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Without this block Prometheus evaluates every rule, shows them as Firing in
# its own UI, and notifies nobody. That was the state of this repository
# through Parts 4 and 5: the alert was made fireable, the runbook entries were
# written, and the last hop did not exist. Raised by a reader of Part 4.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ['ingest:8000']
        labels:
          service: ingest
  - job_name: transform
    static_configs:
      - targets: ['transform:8001']
        labels:
          service: transform
  - job_name: pds-client
    static_configs:
      - targets: ['pds-client:8002']
        labels:
          service: pds-client
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
