# Unit tests for the alerting rules, run with:
#   promtool test rules observability/prometheus/alerts_test.yml
#
# These exist because an alert rule is code that normally only runs during an
# incident. PDSCircuitOpen sat in this repo for weeks watching a series no
# service exported, and nothing in the build said so.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- the alert that could not fire --------------------------------------
  - interval: 1m
    name: PDSCircuitOpen fires once the breaker is open
    input_series:
      - series: 'pybreaker_state{name="pds"}'
        values: "0x5 1x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: PDSCircuitOpen
        exp_alerts: []
      - eval_time: 9m
        alertname: PDSCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
              name: pds
            exp_annotations:
              summary: "PDS circuit breaker is open, so the pipeline is running on message demographics only"
              runbook: "docs/runbook.md#2-pdscircuitopen"

  # This is the state the repo was actually in: the rule was correct, and no
  # service published pybreaker_state, so there was nothing for it to read.
  # A rule watching a series nobody exports is indistinguishable from a
  # healthy system.
  - interval: 1m
    name: with no series exported the rule is silent, which was the bug
    input_series:
      - series: 'up{job="transform"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PDSCircuitOpen
        exp_alerts: []

  - interval: 1m
    name: PDSCircuitOpen stays quiet while the breaker is closed
    input_series:
      - series: 'pybreaker_state{name="pds"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PDSCircuitOpen
        exp_alerts: []

  - interval: 1m
    name: half-open does not fire, only open does
    input_series:
      - series: 'pybreaker_state{name="pds"}'
        values: "2x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PDSCircuitOpen
        exp_alerts: []

  # --- silent data loss ----------------------------------------------------
  - interval: 1m
    name: a steady rate of unparseable dates alerts
    input_series:
      - series: 'hl7_field_dropped_total{segment="PID",field="7",reason="unparseable_date"}'
        values: "0+6x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: FieldsDroppedRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "Dates are failing to parse at more than 3/min, so birth dates are being lost"
              runbook: "docs/runbook.md#6-fieldsdroppedratehigh"

  - interval: 1m
    name: an unmapped address does not trip the date alert
    input_series:
      - series: 'hl7_field_dropped_total{segment="PID",field="11",reason="not_mapped"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: FieldsDroppedRateHigh
        exp_alerts: []

  # --- the identity key ----------------------------------------------------
  - interval: 1m
    name: any sustained rate of invalid NHS numbers alerts
    input_series:
      - series: "nhs_number_invalid_total"
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: InvalidNhsNumbers
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "Identifiers are arriving as NHS numbers that fail their check digit"
              runbook: "docs/runbook.md#7-invalidnhsnumbers"

  - interval: 1m
    name: patient writes with no identity alert once they pass a tenth
    input_series:
      - series: 'patient_write_total{identity="nhs_number"}'
        values: "0+1x60"
      - series: 'patient_write_total{identity="none"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: PatientWritesWithoutIdentity
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "More than 10% of patient writes have no NHS number to match on"
              runbook: "docs/runbook.md#8-patientwriteswithoutidentity"

  - interval: 1m
    name: an all-matched stream does not alert
    input_series:
      - series: 'patient_write_total{identity="nhs_number"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: PatientWritesWithoutIdentity
        exp_alerts: []

  - interval: 1m
    name: a message past the retention window alerts
    input_series:
      - series: "hl7_dlq_oldest_seconds"
        values: "290000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DLQMessagesPastRetention
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "A dead-lettered message has outlived the retention window"
              runbook: "docs/runbook.md#9-dlqmessagespastretention"

  - interval: 1m
    name: a queue inside the window is silent
    input_series:
      - series: "hl7_dlq_oldest_seconds"
        values: "180000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DLQMessagesPastRetention
        exp_alerts: []

  - interval: 1m
    name: an empty queue reports zero and is silent
    input_series:
      - series: "hl7_dlq_oldest_seconds"
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DLQMessagesPastRetention
        exp_alerts: []

  # --- the absence rules, added in Part 7 ---

  - interval: 1m
    name: a service that stops responding is reported down
    input_series:
      - series: 'up{job="transform"}'
        values: "1x5 0x10"
      - series: 'up{job="ingest"}'
        values: "1x15"
      - series: 'up{job="pds-client"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              team: interop
              job: transform
            exp_annotations:
              summary: "transform has been unreachable for 2 minutes"
              runbook: "docs/runbook.md#10-servicedown"

  - interval: 1m
    name: all three healthy is silent
    input_series:
      - series: 'up{job="ingest"}'
        values: "1x20"
      - series: 'up{job="transform"}'
        values: "1x20"
      - series: 'up{job="pds-client"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceTargetMissing
        exp_alerts: []

  # This is the case ServiceDown cannot cover. A target removed from the
  # configuration has no up series at all, so up == 0 never matches.
  - interval: 1m
    name: a target missing from Prometheus entirely is caught by absent
    input_series:
      - series: 'up{job="ingest"}'
        values: "1x20"
      - series: 'up{job="transform"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceTargetMissing
        exp_alerts:
          # absent() returns a series carrying the matcher's own labels, so the
          # alert names the missing service without any extra work.
          - exp_labels:
              severity: critical
              team: interop
              job: pds-client
            exp_annotations:
              summary: "A pipeline service is missing from Prometheus entirely, not just down"
              runbook: "docs/runbook.md#11-servicetargetmissing"

  # The state this repository was in for two months: the rule existed and the
  # series did not.
  - interval: 1m
    name: a breaker gauge nobody exports is caught
    input_series:
      - series: 'up{job="transform"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: BreakerMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
              name: pds
            exp_annotations:
              summary: "pybreaker_state is not being exported, so PDSCircuitOpen cannot fire"
              runbook: "docs/runbook.md#12-breakermetricabsent"

  - interval: 1m
    name: an exported breaker gauge is silent
    input_series:
      - series: 'pybreaker_state{name="pds"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: BreakerMetricAbsent
        exp_alerts: []

  # --- IngestNoTraffic ---
  # Part 7 drafted a 24 hour traffic clause to quiet idle demo stacks, and
  # rejected it: these first two cases are what it would have broken.

  # A pipeline that has carried nothing since it started is the
  # misconfigured-from-day-one case, and it must alert.
  - interval: 1m
    name: a stack that has never carried traffic alerts
    input_series:
      - series: 'http_requests_total{service="ingest",handler="/hl7"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: IngestNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "ingest has not received an HL7 message for 15 minutes"
              runbook: "docs/runbook.md#5-ingestnotraffic"

  # The longer the outage, the more it matters that the alert is still there.
  # Traffic stops at minute 60; at 1600 the pipeline has been silent for over
  # 25 hours.
  - interval: 1m
    name: an outage longer than a day is still alerting
    input_series:
      - series: 'http_requests_total{service="ingest",handler="/hl7"}'
        values: "0+10x60 600x1600"
    alert_rule_test:
      - eval_time: 1600m
        alertname: IngestNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "ingest has not received an HL7 message for 15 minutes"
              runbook: "docs/runbook.md#5-ingestnotraffic"

  # A real pipeline going quiet: traffic earlier in the day, none now.
  - interval: 1m
    name: a pipeline that carried traffic and then stopped does alert
    input_series:
      - series: 'http_requests_total{service="ingest",handler="/hl7"}'
        values: "0+10x60 600x60"
    alert_rule_test:
      - eval_time: 100m
        alertname: IngestNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
              team: interop
            exp_annotations:
              summary: "ingest has not received an HL7 message for 15 minutes"
              runbook: "docs/runbook.md#5-ingestnotraffic"
