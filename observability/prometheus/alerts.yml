groups:
  - name: nhs-interop-golden-signals
    interval: 30s
    rules:

      # --- Latency -----------------------------------------------------------
      - alert: TransformLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="transform"}[5m]))
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "transform p95 latency > 1s for 10 minutes"
          runbook: "docs/runbook.md#1-transformlatencyhigh"

      # --- Traffic (low / dropped) -------------------------------------------
      # On a demo stack left idle this fires after 15 minutes and emails you.
      # That is the rule working: from inside Prometheus an idle demo and a
      # dead upstream look the same. Silence it in Alertmanager if you leave
      # the stack running (runbook section 5).
      #
      # A second clause, "and some traffic in the last 24 hours", was drafted
      # for Part 7 and rejected. It did not stop the demo emails, because the
      # demo had traffic earlier the same day, and it made the rule go silent
      # once an outage passed 24 hours, and never fire for a pipeline that had
      # carried nothing since deployment. alerts_test.yml holds both cases.
      - alert: IngestNoTraffic
        expr: sum(rate(http_requests_total{service="ingest",handler="/hl7"}[10m])) == 0
        for: 15m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "ingest has not received an HL7 message for 15 minutes"
          runbook: "docs/runbook.md#5-ingestnotraffic"

      # --- Errors ------------------------------------------------------------
      - alert: TransformErrorRateHigh
        expr: |
          sum(rate(http_requests_total{service="transform",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="transform"}[5m]))
            > 0.02
        for: 5m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "transform 5xx rate > 2% for 5 minutes"
          runbook: "docs/runbook.md#4-transformerrorratehigh"

      - alert: DLQRateHigh
        expr: sum(rate(hl7_dlq_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "HL7 messages are being dead-lettered at > 6/min"
          runbook: "docs/runbook.md#3-dlqratehigh"

      # --- Saturation --------------------------------------------------------
      # transform exports pybreaker_state from a CircuitBreakerListener. Until
      # that existed this rule could not fire, because nothing published the
      # series it reads.
      - alert: PDSCircuitOpen
        expr: pybreaker_state{name="pds"} == 1
        for: 2m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "PDS circuit breaker is open, so the pipeline is running on message demographics only"
          runbook: "docs/runbook.md#2-pdscircuitopen"

      # --- Silent data loss ----------------------------------------------------
      # A field that does not reach FHIR used to leave no trace at all: the
      # message returned 200 and the Bundle validated without it.
      - alert: FieldsDroppedRateHigh
        expr: sum(rate(hl7_field_dropped_total{reason="unparseable_date"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "Dates are failing to parse at more than 3/min, so birth dates are being lost"
          runbook: "docs/runbook.md#6-fieldsdroppedratehigh"

      # An identifier arriving as an NHS number that fails its Modulus 11 check
      # digit. One is a typo. A steady rate is a sending system with a different
      # numbering scheme, such as a Scottish CHI number in the NHS Number field.
      - alert: InvalidNhsNumbers
        expr: sum(rate(nhs_number_invalid_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "Identifiers are arriving as NHS numbers that fail their check digit"
          runbook: "docs/runbook.md#7-invalidnhsnumbers"

      # Patients written with no NHS number to key on get an unconditional
      # create, so a resend makes a duplicate. A rising share means matching is
      # degrading, which is invisible in the success rate.
      - alert: PatientWritesWithoutIdentity
        expr: |
          sum(rate(patient_write_total{identity="none"}[30m]))
            / clamp_min(sum(rate(patient_write_total[30m])), 0.001)
            > 0.1
        for: 30m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "More than 10% of patient writes have no NHS number to match on"
          runbook: "docs/runbook.md#8-patientwriteswithoutidentity"

      # The dead-letter path holds complete raw HL7 messages, so it is the most
      # sensitive store in the stack. Pruning runs on write and on startup,
      # which means a stack that dead-letters nothing and never restarts keeps
      # its oldest message indefinitely. This is the alert that makes that
      # visible rather than silent. 80 hours against a 72 hour retention leaves
      # room for a prune that has not been triggered yet.
      - alert: DLQMessagesPastRetention
        expr: hl7_dlq_oldest_seconds > 288000
        for: 15m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "A dead-lettered message has outlived the retention window"
          runbook: "docs/runbook.md#9-dlqmessagespastretention"

      # Every rule above this point watches a rate, a ratio or a gauge. All of
      # them share one blind spot: a service that is down exports nothing, so
      # its rates go to zero or its series disappear, and a rule that tests for
      # "too much" of something stops firing exactly when things are worst.
      #
      # Raised by two readers of Part 4. It is also the general form of the bug
      # Part 4 was about: PDSCircuitOpen watched a series no service exported,
      # so it could never fire. These three rules watch for absence itself.

      - alert: ServiceDown
        expr: up{job=~"ingest|transform|pds-client"} == 0
        for: 2m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "{{ $labels.job }} has been unreachable for 2 minutes"
          runbook: "docs/runbook.md#10-servicedown"

      # up{} only exists for a target Prometheus still knows about. If a target
      # is removed from the configuration, or never loaded, `up` disappears and
      # ServiceDown above goes silent too. absent() is what catches that.
      - alert: ServiceTargetMissing
        expr: |
          absent(up{job="ingest"})
          or absent(up{job="transform"})
          or absent(up{job="pds-client"})
        for: 10m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "A pipeline service is missing from Prometheus entirely, not just down"
          runbook: "docs/runbook.md#11-servicetargetmissing"

      # The literal guard against the Part 4 defect recurring. PDSCircuitOpen
      # watched pybreaker_state for two months while no service exported it.
      # If that gauge ever stops being exported again, this fires instead of
      # the pipeline going quietly unmonitored.
      - alert: BreakerMetricAbsent
        expr: absent(pybreaker_state{name="pds"})
        for: 10m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "pybreaker_state is not being exported, so PDSCircuitOpen cannot fire"
          runbook: "docs/runbook.md#12-breakermetricabsent"
