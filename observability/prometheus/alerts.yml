groups:
  - name: nhs-interop-golden-signals
    interval: 30s
    rules:

      # --- Latency -----------------------------------------------------------
      - alert: TransformLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="transform"}[5m]))
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "transform p95 latency > 1s for 10 minutes"
          runbook: "docs/runbook.md#transform-latency"

      # --- Traffic (low / dropped) -------------------------------------------
      - alert: IngestNoTraffic
        expr: sum(rate(http_requests_total{service="ingest",handler="/hl7"}[10m])) == 0
        for: 15m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "ingest has not received an HL7 message for 15 minutes"
          runbook: "docs/runbook.md#ingest-no-traffic"

      # --- Errors ------------------------------------------------------------
      - alert: TransformErrorRateHigh
        expr: |
          sum(rate(http_requests_total{service="transform",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="transform"}[5m]))
            > 0.02
        for: 5m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "transform 5xx rate > 2% for 5 minutes"
          runbook: "docs/runbook.md#transform-errors"

      - alert: DLQRateHigh
        expr: sum(rate(hl7_dlq_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: interop
        annotations:
          summary: "HL7 messages are being dead-lettered at > 6/min"
          runbook: "docs/runbook.md#dlq"

      # --- Saturation --------------------------------------------------------
      # transform exports pybreaker_state from a CircuitBreakerListener. Until
      # that existed this rule could not fire, because nothing published the
      # series it reads.
      - alert: PDSCircuitOpen
        expr: pybreaker_state{name="pds"} == 1
        for: 2m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "PDS circuit breaker is open, so the pipeline is running on message demographics only"
          runbook: "docs/runbook.md#pds-circuit"

      # --- Silent data loss ----------------------------------------------------
      # A field that does not reach FHIR used to leave no trace at all: the
      # message returned 200 and the Bundle validated without it.
      - alert: FieldsDroppedRateHigh
        expr: sum(rate(hl7_field_dropped_total{reason="unparseable_date"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "Dates are failing to parse at more than 3/min, so birth dates are being lost"
          runbook: "docs/runbook.md#fields-dropped"

      # An identifier arriving as an NHS number that fails its Modulus 11 check
      # digit. One is a typo. A steady rate is a sending system with a different
      # numbering scheme, such as a Scottish CHI number in the NHS Number field.
      - alert: InvalidNhsNumbers
        expr: sum(rate(nhs_number_invalid_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "Identifiers are arriving as NHS numbers that fail their check digit"
          runbook: "docs/runbook.md#invalid-nhs-number"

      # Patients written with no NHS number to key on get an unconditional
      # create, so a resend makes a duplicate. A rising share means matching is
      # degrading, which is invisible in the success rate.
      - alert: PatientWritesWithoutIdentity
        expr: |
          sum(rate(patient_write_total{identity="none"}[30m]))
            / clamp_min(sum(rate(patient_write_total[30m])), 0.001)
            > 0.1
        for: 30m
        labels:
          severity: warning
          team: interop
        annotations:
          summary: "More than 10% of patient writes have no NHS number to match on"
          runbook: "docs/runbook.md#patient-identity"
