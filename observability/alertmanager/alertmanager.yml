# Alertmanager config. Locally this routes to Mailpit, a disposable SMTP sink
# with a web inbox, so `make break-pds` produces a notification you can open
# and read rather than a rule that is Firing in a UI nobody is watching.
#
# In production severity=critical maps to a page and warning to a ticket. The
# PagerDuty receiver below is a placeholder: it needs a real routing key, and
# nothing here has ever been pointed at one.
#
# The smarthost previously named 'mailhog', which no configuration in this
# repository ever started. Mailpit is the maintained successor and uses the
# same ports, 1025 for SMTP and 8025 for the inbox.

global:
  resolve_timeout: 5m
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alerts@nhs-interop.example'
  smtp_require_tls: false

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 3h
  routes:
    - matchers: [severity="critical"]
      receiver: pager

receivers:
  - name: default
    email_configs:
      - to: 'interop-oncall@nhs-interop.example'
  - name: pager
    # pagerduty_configs: [...] — wire up with a real routing key in prod.
    email_configs:
      - to: 'interop-pager@nhs-interop.example'

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
