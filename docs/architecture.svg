<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="One admission through the pipeline. A trust integration engine sends an HL7 v2 message over HTTP to the ingest service, which checks the MSH header, adds a trace ID and forwards it to transform over synchronous HTTP. Transform maps the message to a FHIR R4 transaction Bundle, enriches the patient through pds-client, which fails open, and writes the Bundle to a HAPI FHIR server backed by Postgres. If mapping or the write fails, the raw message is saved to a dead-letter folder. Prometheus scrapes every service, Grafana shows the dashboards and five alert rules watch the pipeline." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>One admission through the pipeline. A trust integration engine sends an HL7 v2 message over HTTP to the ingest service, which checks the MSH header, adds a trace ID and forwards it to transform over synchronous HTTP. Transform maps the message to a FHIR R4 transaction Bundle, enriches the patient through pds-client, which fails open, and writes the Bundle to a HAPI FHIR server backed by Postgres. If mapping or the write fails, the raw message is saved to a dead-letter folder. Prometheus scrapes every service, Grafana shows the dashboards and five alert rules watch the pipeline.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7377"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1000" height="640" fill="#F7F6F2"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#18212B" text-anchor="start">One admission through the pipeline</text>
<text x="40" y="80" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#5A6472">Everything here runs locally with <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">make demo</tspan>, using example data only.</text>
<rect x="40" y="268" width="196" height="140" rx="14" fill="#FFFFFF" stroke="#D6D9DD" stroke-width="2"/>
<text x="56" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">Trust engine</text>
<text x="56" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">sends HL7 v2</text>
<text x="56" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">over HTTP</text>
<rect x="284" y="268" width="186" height="140" rx="14" fill="#FFFFFF" stroke="#0D7377" stroke-width="2"/>
<text x="300" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">ingest</text>
<text x="300" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">checks the MSH</text>
<text x="300" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">header and adds</text>
<text x="300" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">a trace ID</text>
<rect x="518" y="268" width="206" height="140" rx="14" fill="#FFFFFF" stroke="#0D7377" stroke-width="2"/>
<text x="534" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">transform</text>
<text x="534" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">maps HL7 v2 to a FHIR</text>
<text x="534" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">R4 transaction Bundle</text>
<rect x="772" y="268" width="188" height="140" rx="14" fill="#FFFFFF" stroke="#0D7377" stroke-width="2"/>
<text x="788" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">HAPI FHIR</text>
<text x="788" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">stores the Bundle</text>
<text x="788" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">in Postgres</text>
<rect x="518" y="102" width="206" height="108" rx="14" fill="#FFFFFF" stroke="#D6D9DD" stroke-width="2"/>
<text x="534" y="134" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">pds-client</text>
<text x="534" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">looks up the patient:</text>
<text x="534" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">a stub by default</text>
<rect x="518" y="452" width="206" height="104" rx="14" fill="#FBEEDC" stroke="#B45309" stroke-width="2"/>
<text x="534" y="484" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" fill="#18212B">dead-letter folder</text>
<text x="534" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">raw message saved;</text>
<text x="534" y="530" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6472">replay is manual</text>
<line x1="238" y1="338" x2="280" y2="338" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="472" y1="338" x2="514" y2="338" stroke="#0D7377" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="726" y1="338" x2="768" y2="338" stroke="#0D7377" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="621" y1="264" x2="621" y2="214" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ag)" marker-start="url(#ag)"/>
<line x1="621" y1="412" x2="621" y2="448" stroke="#B45309" stroke-width="2.5" marker-end="url(#aa)" stroke-dasharray="6 5"/>
<text x="636" y="232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5A6472" text-anchor="start">enrich, fail open</text>
<text x="636" y="428" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#B45309" text-anchor="start">mapping or write fails</text>
<text x="284" y="432" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5A6472"><tspan x="284"><tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">ingest</tspan> to <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">transform</tspan> is</tspan><tspan x="284" dy="19">synchronous HTTP today.</tspan><tspan x="284" dy="19">SQS FIFO is roadmap item 1.</tspan></text>
<rect x="40" y="580" width="920" height="40" rx="12" fill="#ECEEEA"/>
<text x="255" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#18212B" text-anchor="middle">Prometheus scrapes every service</text>
<text x="395" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6472" text-anchor="middle">·</text>
<text x="500" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#18212B" text-anchor="middle">Grafana dashboards</text>
<text x="618" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5A6472" text-anchor="middle">·</text>
<text x="710" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#18212B" text-anchor="middle">five alert rules</text>
</svg>
